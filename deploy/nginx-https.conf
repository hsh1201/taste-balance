server {
    listen 80;
    listen [::]:80;
    server_name __ADDRESS__;
    # 옮겨 가는 주소에 비밀 링크가 들어 있을 수 있어 로그를 남기지 않는다.
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __ADDRESS__;

    ssl_certificate /etc/letsencrypt/live/__ADDRESS__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__ADDRESS__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include snippets/taste-balance-proxy.conf;
}
