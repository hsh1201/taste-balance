# HTTP와 HTTPS 설정이 함께 쓰는 프록시 설정이다.
client_max_body_size 64k;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# 접속자가 보낸 값에 덧붙이지 않고 덮어써서 IP를 위조해 rate limit을 피하지 못하게 한다.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# AI 코멘트는 시간 제한 45초에 재시도 1회라 최대 90초 넘게 걸릴 수 있다. 기본값 60초면 중간에 끊긴다.
proxy_read_timeout 120s;

location /.well-known/acme-challenge/ {
    root /var/www/certbot;
}

# /r/와 /g/ 주소에는 비밀 링크가 들어 있어 로그에 남기지 않는다.
location ~ ^/(r|g)/ {
    access_log off;
    error_log /var/log/nginx/taste-balance-private.log crit;
    proxy_pass http://127.0.0.1:8000;
}

location / {
    proxy_pass http://127.0.0.1:8000;
}
